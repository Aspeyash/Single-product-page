<!--
  ============================================================================
  STATIC VISUAL MOCKUP — SELF-CONTAINED FILE
  ============================================================================
  This is a single-file, self-contained HTML reconstruction of the CURRENT
  rendered output of templates/store.php (ZYMARG_Store_Page_1.21.3.zip),
  built for visual review only. It is NOT the plugin source and is not meant
  to be installed on WordPress — just open it in any browser.

  Every section, class name, and DOM structure in the previewed page is
  copied exactly from templates/store.php, includes/premium-sections.php,
  and their partials. PHP conditionals/loops have been resolved with
  representative sample data so the page renders standalone. All plugin CSS
  (zymarg-tokens.css, store-tailwind.css, store-page.css) is embedded
  directly in this file — no external files required (aside from the
  optional CDN font, which has a system-font fallback, and the placeholder
  images from placehold.co, which need an internet connection to load).

  WHY AN <iframe> IS USED FOR THE PREVIEW:
  The real page markup is injected into an <iframe> (via srcdoc) instead of
  being placed directly in this document. This is required for the Desktop/
  Tablet/Mobile switcher below to work correctly: CSS media queries
  (sm:/md:/lg: breakpoints) evaluate against the actual rendered width of
  the element they live in — an iframe is its own independent browsing
  context with its own "viewport", so resizing the iframe genuinely changes
  which responsive rules apply, exactly like resizing a real browser window.
  A plain <div> with max-width would NOT trigger the breakpoints correctly,
  since the media queries would still see the outer page's full width.

  The Desktop/Tablet/Mobile toolbar itself is NOT part of the real plugin —
  it exists only in this mockup file for previewing convenience.
  ============================================================================
-->

<!-- ================= MOCKUP-ONLY SWITCHER + IFRAME INJECTION SCRIPT ================= -->
<script>
(function () {
  var toolbar   = document.getElementById('zy-mockup-toolbar');
  var viewport  = document.getElementById('zy-mockup-viewport');
  var widthTag  = document.getElementById('zy-mt-width');
  var buttons   = toolbar.querySelectorAll('button[data-zy-view]');
  var frame     = document.getElementById('zy-frame');
  var cssText   = document.getElementById('zy-shared-css').textContent;
  var bodyHTML  = document.getElementById('zy-page-body').innerHTML;

  var widths = {
    desktop: '1440px+ (fluid)',
    tablet:  '834px (iPad-style)',
    mobile:  '390px (iPhone-style)'
  };

  // Build the full standalone document that goes inside the iframe. This
  // gives the preview its OWN browsing context, so its CSS media queries
  // (sm:/md:/lg:) evaluate against the iframe's real rendered width —
  // exactly like a real browser window at that size — rather than the
  // width of the outer mockup page.
  var frameDoc =
    '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
    '<link rel="preconnect" href="https://cdn.jsdelivr.net">' +
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.min.css">' +
    '<style>' + cssText + '</style>' +
    '</head><body>' + bodyHTML + '</body></html>';

  function fitIframeHeight() {
    try {
      var doc = frame.contentDocument;
      if (!doc || !doc.documentElement) return;
      var h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      frame.style.height = h + 'px';
    } catch (e) { /* no-op */ }
  }

  frame.addEventListener('load', function () {
    fitIframeHeight();
    try {
      var doc = frame.contentDocument;
      if (window.ResizeObserver && doc && doc.body) {
        var ro = new ResizeObserver(function () { fitIframeHeight(); });
        ro.observe(doc.body);
      }
      // Images (placehold.co) load asynchronously and can change height —
      // re-fit once each finishes loading.
      var imgs = doc.querySelectorAll('img');
      imgs.forEach(function (img) {
        img.addEventListener('load', fitIframeHeight);
      });
    } catch (e) { /* no-op */ }
    // A few delayed re-checks cover any late webfont/layout shifts.
    setTimeout(fitIframeHeight, 150);
    setTimeout(fitIframeHeight, 500);
    setTimeout(fitIframeHeight, 1200);
  });

  frame.srcdoc = frameDoc;

  function setView(view) {
    viewport.classList.remove('is-tablet', 'is-mobile');
    if (view === 'tablet') viewport.classList.add('is-tablet');
    if (view === 'mobile') viewport.classList.add('is-mobile');
    widthTag.textContent = widths[view] || '';
    buttons.forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-zy-view') === view);
    });
    // Width just changed via CSS max-width on the wrapper — the iframe's
    // rendered width changes too, which reflows its internal media queries.
    // Re-measure height a few times as that reflow (and any image reflow)
    // settles.
    setTimeout(fitIframeHeight, 50);
    setTimeout(fitIframeHeight, 300);
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setView(btn.getAttribute('data-zy-view'));
    });
  });

  window.addEventListener('resize', fitIframeHeight);
})();
</script>
